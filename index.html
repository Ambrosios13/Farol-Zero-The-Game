<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Farol Zero</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-root">
    <canvas id="game-canvas"></canvas>

    <!-- HUD (Phase 2 fills values; container exists early to reserve layout) -->
    <div id="hud" class="safe-pad">
      <div id="hud-top">
        <div id="hud-hp" aria-label="vida">100</div>
        <div id="hud-timer">0:00</div>
      </div>
    </div>

    <!-- Virtual joystick (cellular requirement since phase 1) -->
    <div id="joystick" class="safe-pad-left">
      <div id="joystick-base"></div>
      <div id="joystick-knob"></div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three.module.js"
      }
    }
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
